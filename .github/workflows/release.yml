name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        run: |
          missing=0
          for name in \
            ANDROID_SIGNING_KEYSTORE_BASE64 \
            ANDROID_SIGNING_STORE_PASSWORD \
            ANDROID_SIGNING_KEY_ALIAS \
            ANDROID_SIGNING_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required to build signed release artifacts."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare signing keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/liteai-signing.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release packages
        run: ./gradlew assembleRelease bundleRelease

      - name: Resolve version name
        id: version
        run: echo "name=$(./gradlew -q :app:printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liteai-release-${{ steps.version.outputs.name }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: LiteAi ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          overwrite_files: true
